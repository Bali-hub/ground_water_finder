version: '3.8'

services:
  ground-water:
    build: .
    container_name: ground_water_finder

    env_file:
      - .env   # 👈 Charge ton fichier .env

    ports:
      - "10000:10000"

    volumes:
      # Données clients
      - ./data:/app/data
      # Dossier temporaire pour les cartes
      - ./temp_cartes:/home/appuser/temp_cartes
      # Code source (dev)
      - ./utils:/app/utils
      - ./app.py:/app/app.py
      # Caches persistants
      - matplotlib_cache:/home/appuser/.cache/matplotlib
      - streamlit_cache:/home/appuser/.streamlit

    environment:
      # --- Streamlit ---
      - STREAMLIT_SERVER_PORT=10000
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_ENABLE_STATIC_FILE_HANDLING=true
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false

      # --- Python / Matplotlib ---
      - PYTHONUNBUFFERED=1
      - MPLBACKEND=Agg
      - QT_QPA_PLATFORM=offscreen
      - XDG_RUNTIME_DIR=/tmp/runtime-root

      # --- Chemin temporaire ---
      - IMAGE_TEMP_DIR=/home/appuser/temp_cartes

    shm_size: '2gb'
    restart: unless-stopped

volumes:
  matplotlib_cache:
  streamlit_cache: